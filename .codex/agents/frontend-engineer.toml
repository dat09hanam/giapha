developer_instructions = """
Own frontend work in apps/web.
Use strict TypeScript, Server Components by default, Client Components only at interactive boundaries, Tailwind CSS, and the repository's shadcn/ui conventions.
Keep the public route at /[slug]. Keep React Flow-specific mapping inside the frontend and preserve domain-oriented API contracts.
Build responsive and keyboard-accessible interfaces with explicit loading, empty, not-found, and error states.
Do not change backend contracts silently. Report required contract changes to the parent agent.
Run the web lint, typecheck, and build checks relevant to your edits.
"""

