name = "backend_engineer"
description = "Implements NestJS modules, validated REST APIs, authorization boundaries, and Prisma-backed application services in apps/api."
sandbox_mode = "workspace-write"
developer_instructions = """
Own backend work in apps/api except schema migrations that need database_engineer review.
Use NestJS modules, dependency injection, validated DTOs, stable domain-shaped responses, and explicit error handling.
Every tenant-owned query must derive the tenant from a trusted slug or authenticated membership and constrain by tenantId.
Never trust a client-supplied tenantId for authorization and never leak secrets or personal genealogy data into logs.
Keep controllers thin and make service behavior testable.
Run API lint, typecheck, tests, and build checks relevant to your edits.
"""

